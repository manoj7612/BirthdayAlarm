{% extends 'base.html' %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Create your account</h2>
  <p class="muted">Set up your birthday alarm in less than a minute.</p>
  <form method="post" class="form">
    <label>Full name
      <input type="text" name="name" placeholder="John Doe" required value="{{ request.form.get('name', '') }}">
    </label>
    <label>Email address
      <input type="email" name="email" placeholder="you@example.com" required value="{{ request.form.get('email', '') }}">
    </label>
    <label>Password
      <input type="password" name="password" placeholder="At least 6 characters" required>
    </label>
    <label>Confirm password
      <input type="password" name="confirm" placeholder="Re-enter password" required>
    </label>
    <label>Your birthday
      <input type="date" name="birthday" required value="{{ request.form.get('birthday', '') }}">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Create account 🎉</button>
  </form>
  <p class="muted center">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
{% endblock %}
