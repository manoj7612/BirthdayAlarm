{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Welcome back</h2>
  <p class="muted">Sign in to manage your birthday alarms.</p>
  <form method="post" class="form">
    <label>Email address
      <input type="email" name="email" placeholder="you@example.com" required value="{{ request.form.get('email', '') }}">
    </label>
    <label>Password
      <input type="password" name="password" placeholder="Your password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </form>
  <p class="muted center">Don't have an account? <a href="{{ url_for('signup') }}">Create one</a></p>
</div>
{% endblock %}
